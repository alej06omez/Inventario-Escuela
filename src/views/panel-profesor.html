<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de profesor</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="ancho" data-rol="profesor">
  <h1>Panel de profesor</h1>
  <nav>
    <a href="/prestamos/registro">Añadir préstamo</a>
    <button id="salir">Cerrar sesión</button>
  </nav>
  <p id="aviso" role="status"></p>
  <table id="equipos">
    <thead>
      <tr><th>Nombre</th><th>Concepto</th><th>Cantidad</th><th>Descripción</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <h2>Préstamos activos</h2>
  <table id="prestamos">
    <thead>
      <tr><th>Equipo</th><th>Usuario</th><th>Fecha inicio</th><th>Hora inicio</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="/panel.js"></script>
</body>
</html>
